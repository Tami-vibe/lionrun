else if(view==='new-page'){head.innerHTML+=`<div class="breadcrumb"><button data-command="pages">${I('arrow-left')}Back to pages</button></div>`+titleRow('Create a page');body.innerHTML='<div style="padding-top:18px"><label class="field"><span>Page name</span><input id="new-page-name" placeholder="e.g. Our story"></label><label class="field"><span>Start with</span><select id="new-page-template"><option>Service</option><option>Offer</option><option>Story</option><option>Empty</option></select></label><button class="wide button-preview" data-command="create-page">Create page</button></div>';}
else if(view==='add-section'){head.innerHTML+=`<div class="breadcrumb"><button data-command="sections">${I('arrow-left')}Back to sections</button></div>`+titleRow('Add a section');body.innerHTML='<p class="hint" style="margin-top:14px">Sections are placed in the page’s fixed order.</p>'+catalog.filter(x=>!['Header','Footer'].includes(x[0])).map(([n,i])=>`<button class="pagenav" data-new-section="${n}">${I(i)}<span class="grow">${n}</span>${I('plus')}</button>`).join('');}
else if(view==='motion'){head.innerHTML+=`<div class="breadcrumb"><button data-command="editor">${I('arrow-left')}Back to media</button></div>`+titleRow('Photo motion');body.innerHTML='<div style="padding-top:18px"><div class="photo-preview" id="motion-preview"></div>'+select('Camera movement','motion',['Slow push','Gentle pan','Pull back','None'])+select('Look','look',['Natural','Cinematic','Warm','Black & white'])+range('Intensity','intensity',0,100)+'<button class="wide" data-command="play-motion">'+I('play')+'Preview motion</button><p class="hint">Photo animation preview. Video encoding and AI generation require a separate rendering integration.</p></div>';}
if(view!=='editor'){body.removeAttribute('role');body.removeAttribute('aria-labelledby')}q('#canvas-context').textContent=p.name+' / '+(view==='sections'?'Sections':b.type);icons();persist();}
function imgStyle(b){return b.upload?`background-image:url('${b.upload}')`:''}function heroMarkup(b){return `<section class="site-hero ${b.id===selected?'selected-outline':''}" data-canvas-section="${b.id}" style="text-align:${b.align.toLowerCase()};min-height:${b.height==='Compact'?400:b.height==='Full screen'?650:560}px">${b.id===selected?'<span class="selection-tag">'+I('panels-top-left')+' '+E(b.type)+'</span>':''}<div class="hero-art" style="${imgStyle(b)};background-position:${b.focusX}% ${b.focusY}%;transform:scale(${b.zoom/100})"></div><div class="hero-shade" style="opacity:${Math.min(1,b.darkness/65)}"></div><div class="hero-kicker clickable" data-open="message">${E(b.eyebrow)}</div><h1 class="hero-title clickable" data-open="message" style="font-size:${device==='mobile'?Math.min(b.fontSize,32):device==='tablet'?Math.min(b.fontSize,38):b.fontSize}px;font-weight:${{Regular:400,Medium:500,Bold:700}[b.weight]||700};line-height:${b.lineHeight};letter-spacing:${b.tracking}px;color:${b.color};font-family:${b.font==='Georgia'?'Georgia,serif':'inherit'}">${E(b.title)}</h1><p class="hero-description clickable" data-open="message">${E(b.description)}</p><div class="site-buttons"><button class="primary" data-open="buttons">${E(b.mainLabel)}${b.mainIcon!=='none'?I(b.mainIcon):''}</button>${b.showSecondary?`<button data-open="buttons">${E(b.secondaryLabel)}${b.secondaryIcon!=='none'?I(b.secondaryIcon):''}</button>`:''}</div><div class="trustline clickable" data-open="trust">${b.trust.map(x=>`<span>${I(x.icon)}${E(x.label)}</span>`).join('')}</div>${b.statsPosition==='Hidden'?'':`<div class="stats clickable" data-open="stats">${b.stats.map(x=>`<div><b>${E(x.value)}</b>${E(x.label)}</div>`).join('')}</div>`}<div class="gallery-strip"><button data-open="media" aria-label="Edit background image">01</button><button data-open="story" aria-label="Edit gallery slide 2">02</button><button data-open="story" aria-label="Edit gallery slide 3">03</button></div></section>`}
function genericMarkup(b){const isSelected=b.id===selected;let items=b.items||[];return `<section class="site-section ${isSelected?'selected-outline':''}" data-canvas-section="${b.id}" style="padding-top:${Math.min(b.paddingTop,90)/2+12}px;padding-bottom:${Math.min(b.paddingBottom,90)/2+12}px">${isSelected?'<span class="selection-tag">'+E(b.type)+'</span>':''}<span style="font-size:9px;letter-spacing:1.5px;color:#7860bd">${E(b.eyebrow)}</span><h3 data-open="message" class="clickable">${E(b.title)}</h3><p data-open="message" class="clickable">${E(b.description)}</p>${items.length?`<div class="site-cards" style="grid-template-columns:repeat(${device==='mobile'?1:Math.min(Number(b.columns)||2,2)},minmax(0,1fr))">${items.filter(x=>x.visible!==false).map((x,i)=>`<div class="site-card"><div class="card-media" ${x.upload?'style="background-image:url(\''+x.upload+'\')"':''}></div><h4>${E(x.title||x.name||x.question||x.heading||x.label)}</h4><p>${E(x.description||x.quote||x.answer||x.text||x.note||'')}</p>${x.value?'<b>'+E(x.value)+'</b>':''}${x.price?'<p>'+E(x.price)+'</p>':''}<button data-canvas-item="${i}" data-block="${b.id}">${I('pencil')}Edit ${b.type==='Services'?'service':'item'}</button></div>`).join('')}</div>`:''}${b.type==='Contact'?'<p>'+E(b.address)+'<br>'+E(b.phone)+'<br>'+E(b.email)+'<br>'+E(b.hours)+'</p>':''}${b.type==='Promotion'?'<h3>'+E(b.price)+'</h3><p>'+E(b.offer)+'</p>':''}${b.type==='Quote request'?'<button disabled>'+E(b.submitLabel)+'</button>':''}</section>`}
function paint(){const p=page(),b=current(),hero=p.blocks.find(x=>x.type==='Hero');let showing=[];if(view==='sections'||view==='pages'||view==='page-settings'){showing=p.blocks.filter(x=>['Hero','Services'].includes(x.type));}else if(b.type==='Header'||b.type==='Footer'){showing=hero?[hero]:p.blocks.slice(0,1)}else showing=[b];canvas.innerHTML=`<div class="site-chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:7px">${E(p.name)}</span><span style="margin-left:auto">northline.example</span></div>${state.header.hidden?'':`<header class="website-header" data-canvas-section="shared-header"><span class="site-logo">${E(state.business.name.charAt(0))}</span><b>${E(state.business.name.toUpperCase())}</b><nav>${E(state.header.links).split('\n').slice(0,5).join('　 ')}</nav></header>`}${showing.map(x=>x.hidden?`<section class="site-section"><span class="pill">Hidden section</span><h3>${E(x.type)}</h3><p>Your content is saved. Show this section to include it on the page.</p><button data-toggle="${x.id}">${I('eye')}Show section</button></section>`:x.type==='Hero'?heroMarkup(x):genericMarkup(x)).join('')}${!showing.length?'<section class="site-section"><h3>A fresh start.</h3><p>Add your first section from the editor.</p></section>':''}${b.type==='Footer'?`<section class="site-section"><h3>${E(state.footer.title)}</h3><p>${E(state.footer.copyright)}</p></section>`:''}`;canvas.style.maxWidth=device==='mobile'?'340px':device==='tablet'?'470px':'100%';icons();}
function update(prop,value){let target=current(),key=prop;if(prop.startsWith('item.')){target=target[editingItem[0]][editingItem[1]];key=prop.slice(5)}else if(prop.startsWith('page.')){target=page();key=prop.slice(5)}else if(prop.startsWith('business.')){target=state.business;key=prop.slice(9)}target[key]=value;if(key==='linePercent')target.lineHeight=Number(value)/100;if(key==='linePreset')target.lineHeight={Tight:1.05,Comfortable:1.2,Loose:1.5}[value];if(key==='trackingPreset')target.tracking={Tight:-1,Normal:0,Wide:1.5}[value];if(key==='spacing'){target.paddingTop={Compact:32,Balanced:72,Spacious:112}[value];target.paddingBottom=target.paddingTop}persist();paint();notify('Draft updated. Undo is available.');}
function selectBlock(id){selected=id;editingItem=null;view='editor';tab='Content';menu=null;render();paint()}
root.addEventListener('input',e=>{const t=e.target;if(!t.dataset.prop)return;checkpoint();const val=t.type==='checkbox'?t.checked:t.type==='number'||t.type==='range'?Number(t.value):t.value;update(t.dataset.prop,val);if(t.type==='range')t.nextElementSibling.textContent=val+'%'});root.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.prop){checkpoint();update(t.dataset.prop,t.value)}if(t.id==='premium-file'&&t.files[0]){const f=t.files[0];if(f.type.startsWith('image/')){if(f.size>1500000){notify('For this preview, choose an image under 1.5 MB.');return}const reader=new FileReader();reader.onload=()=>{checkpoint();if(view==='item'){current()[editingItem[0]][editingItem[1]].upload=reader.result}else{current().upload=reader.result;current().media=f.name}persist();render();paint();notify('Image added to this local draft.')};reader.readAsDataURL(f)}else notify('Video chosen. Actual video upload and encoding belong to the production integration.')}});
root.addEventListener('click',e=>{const b=e.target.closest('button'),itemTarget=e.target.closest('[data-canvas-item]'),target=e.target.closest('[data-open]');if(itemTarget){selected=itemTarget.dataset.block;editingItem=['items',Number(itemTarget.dataset.canvasItem)];view='item';render();paint();return}if(target){const s=target.closest('[data-canvas-section]');if(s)selected=s.dataset.canvasSection;view='editor';tab='Content';render();const g=q('#p-group-'+target.dataset.open);if(g){g.open=true;g.scrollIntoView({block:'nearest',behavior:'smooth'})}paint();return}if(!b)return;
if(b.dataset.select){selectBlock(b.dataset.select);return}if(b.dataset.page){pageId=b.dataset.page;selected=page().blocks[0]?.id;view='sections';render();paint();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.device){device=b.dataset.device;qa('[data-device]').forEach(x=>x.setAttribute('aria-pressed',x===b));q('#device-label').textContent=device[0].toUpperCase()+device.slice(1);paint();return}if(b.dataset.set){checkpoint();update(b.dataset.set,b.dataset.value);render();return}if(b.dataset.edit){const [c,i]=b.dataset.edit.split(':');editingItem=[c,Number(i)];view='item';render();return}if(b.dataset.remove){checkpoint();const [c,i]=b.dataset.remove.split(':');current()[c].splice(Number(i),1);persist();render();paint();return}if(b.dataset.add){const c=b.dataset.add;if(c==='items'&&current().type==='Quote request'&&current().items.length>=12){notify('This form supports up to 12 fields.');return}checkpoint();let x=c==='trust'?{label:'New highlight',icon:'star'}:Object.fromEntries((types[current().type]||['title','description']).map(k=>[k,k==='required'?false:k==='icon'?'star':k==='title'?'New item':'']));current()[c].push(x);editingItem=[c,current()[c].length-1];view='item';persist();render();paint();return}if(b.dataset.toggle){checkpoint();const x=allBlocks().find(x=>x.id===b.dataset.toggle);x.hidden=!x.hidden;persist();render();paint();return}if(b.dataset.newSection){if(page().blocks.length>=80){notify('This page has reached its 80-block limit.');return}checkpoint();const x=block(b.dataset.newSection,'new-'+Date.now()+'-'+uid++);page().blocks.push(x);page().blocks.sort((a,b)=>catalog.findIndex(x=>x[0]===a.type)-catalog.findIndex(x=>x[0]===b.type));selected=x.id;view='editor';persist();render();paint();return}if(b.hasAttribute('data-upload')){q('#premium-file')?.click();return}if(b.hasAttribute('data-video')){view='motion';render();return}if(b.hasAttribute('data-reset-type')){checkpoint();Object.assign(current(),{font:'Site font',fontSize:44,weight:'Bold',lineHeight:1.12,tracking:-1});persist();render();paint();return}if(b.id==='preview-toggle'){const ws=q('.workspace');const on=ws.classList.toggle('preview-mode');b.innerHTML=I(on?'pencil':'scan-eye')+(on?'Back to editor':'Preview');icons();return}
const cmd=b.dataset.command;if(!cmd)return;if(['pages','sections','editor','page-settings','business','new-page','add-section'].includes(cmd)){view=cmd;menu=null;render();paint();return}if(cmd==='options'){menu=!menu;render();return}if(cmd==='toggle'){checkpoint();current().hidden=!current().hidden;persist();render();paint();return}if(cmd==='undo'||cmd==='redo'){const from=cmd==='undo'?history:future,to=cmd==='undo'?future:history;if(from.length){to.push(clone(state));state=from.pop();if(!state.pages.find(p=>p.id===pageId))pageId=state.pages[0].id;persist();render();paint();notify(cmd==='undo'?'Change undone.':'Change restored.')}else notify('No changes to '+cmd+'.');return}if(cmd==='duplicate'){checkpoint();const copy=clone(current());copy.id='copy-'+Date.now();page().blocks.push(copy);page().blocks.sort((a,b)=>catalog.findIndex(x=>x[0]===a.type)-catalog.findIndex(x=>x[0]===b.type));selected=copy.id;menu=null;persist();render();paint();return}if(cmd==='delete'){head.insertAdjacentHTML('beforeend','<div class="notice">Remove this section from the draft?<div class="pair" style="margin-top:9px"><button data-command="confirm-delete">Delete section</button><button data-command="cancel-delete">Keep section</button></div></div>');return}if(cmd==='cancel-delete'){menu=null;render();return}if(cmd==='confirm-delete'){checkpoint();const x=current();if(['Header','Footer'].includes(x.type)){x.hidden=true;notify('Shared '+x.type.toLowerCase()+' hidden in this visual concept.')}else page().blocks=page().blocks.filter(y=>y.id!==selected);selected=page().blocks[0]?.id;view='sections';menu=null;persist();render();paint();return}if(cmd==='create-page'){if(state.pages.length>=30){notify('The website supports up to 30 pages.');return}const name=q('#new-page-name').value.trim();if(!name){notify('Enter a page name.');q('#new-page-name').focus();return}checkpoint();const template=q('#new-page-template').value,p={id:'page-'+Date.now(),name,placement:'Bottom menu',theme:'Dark',accent:'#8063ff',seoTitle:name,seoDescription:'',blocks:template==='Empty'?[]:[block('Hero','new-hero-'+uid++),block(template==='Service'?'Services':template==='Offer'?'Promotion':'About and gallery','new-body-'+uid++)]};state.pages.push(p);pageId=p.id;selected=p.blocks[0]?.id;view='sections';persist();render();paint();return}if(cmd==='sync-contact'){checkpoint();state.pages.forEach(p=>p.blocks.filter(b=>b.type==='Contact').forEach(b=>Object.assign(b,{address:state.business.address,phone:state.business.phone,email:state.business.email,hours:state.business.hours})));persist();notify('Contact sections updated from the business profile.');return}if(cmd==='reset-page'){head.insertAdjacentHTML('beforeend','<div class="notice">Restore this page’s starter content?<div class="pair" style="margin-top:8px"><button data-command="confirm-reset">Restore</button><button data-command="page-settings">Cancel</button></div></div>');return}if(cmd==='confirm-reset'){checkpoint();page().blocks=catalog.filter(x=>!['Header','Footer'].includes(x[0])).map(([n])=>block(n,'restore-'+uid++));selected=page().blocks[0]?.id;view='sections';persist();render();paint();return}if(cmd==='play-motion'){const el=q('#motion-preview');const keyframes=current().motion==='Gentle pan'?[{backgroundPosition:'40% center'},{backgroundPosition:'60% center'}]:[{backgroundSize:'100%'},{backgroundSize:'125%'}];el.animate(keyframes,{duration:4000,fill:'forwards'});notify('Previewing a photo camera move. No video has been rendered.');}
});
render();paint();persist();
})();
</script>
